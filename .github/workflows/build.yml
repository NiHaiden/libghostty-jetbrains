name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native library (all platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Native tests
        working-directory: native
        run: zig build test

      # Zig cross-compiles every target from one Linux runner.
      - name: Build libghostty-jb for all platforms
        run: native/scripts/build-all.sh native/dist

      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: native/dist
          if-no-files-found: error

  plugin:
    name: Plugin (test, build, verify)
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native
          path: native/dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      - name: Verify plugin against recommended IDEs
        run: ./gradlew verifyPlugin

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports

  # The libraries for macOS and Windows are cross-compiled; make sure they
  # really load and behave on those systems.
  platform-tests:
    name: Binding tests (${{ matrix.os }})
    needs: native
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: native
          path: native/dist

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run binding tests against the shipped library
        run: ./gradlew test --tests "com.github.nihaiden.ghostty.vt.*"

  release:
    name: Attach plugin to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, platform-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
