pluginGroup = com.github.nihaiden.ghostty
pluginName = Ghostty Terminal
pluginVersion = 0.2.0

# Oldest IDE build we support. 253 = 2025.3 (runs on JBR 21).
pluginSinceBuild = 253

# IDE to compile against and to launch with `./gradlew runIde`.
platformVersion = 2025.3.6

# Where packaged native libraries come from: <dir>/<os>-<arch>/<lib>.
# CI fills native/dist for every platform; locally `buildNativeHost` builds
# just the current one.
nativeDistDir = native/dist

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx3g
